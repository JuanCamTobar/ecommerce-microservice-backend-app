name: Automatic Release Notes

on:
  push:
    branches:
      - master
      - main
      - develop
      - stage

jobs:
  generate-release-notes:
    name: Generate & Publish Release Notes
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Git info
        run: |
          echo "Current branch: ${{ github.ref_name }}"
          echo "Repository: ${{ github.repository }}"

      - name: Determine next version
        id: version
        uses: anothrNick/github-tag-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          RELEASE_BRANCHES: master,main,develop,stage
          DRY_RUN: false

      - name: Generate Release Notes
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: "Release ${{ steps.version.outputs.new_tag }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "Release created: ${{ steps.version.outputs.new_tag }}"
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.new_tag }}"
