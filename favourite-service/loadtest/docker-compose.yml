version: '3.3'

services:
  locust:
    image: locustio/locust:2.16.0
    restart: unless-stopped
    volumes:
      - ./locustfile.py:/mnt/locust/locustfile.py:ro
    ports:
      - "8089:8089"
    environment:
      - TARGET_HOST=http://favourite-service-container:8800
    command: -f /mnt/locust/locustfile.py --host http://favourite-service-container:8800
    networks:
      - microservices_network

networks:
  microservices_network:
    external: true
    name: ecommerce-microservice-backend-app_microservices_network
