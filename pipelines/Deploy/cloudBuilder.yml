steps:
  - name: 'gcr.io/cloud-builders/mvn'
    args: ['clean', 'package', '-DskipTests']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/api-gateway', '-f', 'api-gateway/Dockerfile', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/cloud-config', '-f', 'cloud-config/Dockerfile', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/service-discovery', '-f', 'service-discovery/Dockerfile', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/proxy-client', '-f', 'proxy-client/Dockerfile', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/user-service', '-f', 'user-service/Dockerfile', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/product-service', '-f', 'product-service/Dockerfile', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/order-service', '-f', 'order-service/Dockerfile', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/payment-service', '-f', 'payment-service/Dockerfile', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/favourite-service', '-f', 'favourite-service/Dockerfile', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/shipping-service', '-f', 'shipping-service/Dockerfile', '.']

images:
  - 'gcr.io/$PROJECT_ID/api-gateway'
  - 'gcr.io/$PROJECT_ID/cloud-config'
  - 'gcr.io/$PROJECT_ID/service-discovery'
  - 'gcr.io/$PROJECT_ID/proxy-client'
  - 'gcr.io/$PROJECT_ID/user-service'
  - 'gcr.io/$PROJECT_ID/product-service'
  - 'gcr.io/$PROJECT_ID/order-service'
  - 'gcr.io/$PROJECT_ID/payment-service'
  - 'gcr.io/$PROJECT_ID/favourite-service'
  - 'gcr.io/$PROJECT_ID/shipping-service'
