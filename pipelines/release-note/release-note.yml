# Simulación de las variables de sustitución originales con valores fijos
substitutions:
  _CLUSTER_NAME: "demo-cluster-01"
  _CLUSTER_ZONE: "us-west1-a"
  _PROJECT_ID: "proyecto-ejemplo-98765"

steps:

  - name: 'gcr.io/cloud-builders/git'
    id: 'Generate Release Notes'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        NEW_TAG=$(head /dev/urandom | tr -dc A-Za-z0-9 | head -c 7)
        BRANCH_NAME_TO_USE="main-fija"
        BUILD_DATE="2025-10-31 10:30:00"
        LASTTAG_GIT="v1.2.3"
        
        echo "Etiqueta/Tag generada: ${NEW_TAG}"
        echo "Rama usada: ${BRANCH_NAME_TO_USE}"

        RELEASE_FILE="/workspace/release_notes_${NEW_TAG}.md"
        
        echo "# Notas de Versión - ${NEW_TAG}" > $RELEASE_FILE
        echo "" >> $RELEASE_FILE
        echo "## Cambios desde la versión $LASTTAG_GIT (Simulación)" >> $RELEASE_FILE
        echo "- **FIX:** Error de inicialización corregido (Commit ${NEW_TAG})" >> $RELEASE_FILE
        echo "- **FEAT:** Se añadió soporte para nuevo servicio." >> $RELEASE_FILE
        echo "" >> $RELEASE_FILE
        echo "Fecha de Compilación: $BUILD_DATE" >> $RELEASE_FILE
        
        echo "--- Contenido del archivo ---"
        cat $RELEASE_FILE
        echo "-----------------------------"
        
        cp $RELEASE_FILE /workspace/release_notes.md


  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Upload Release Notes'
    waitFor: ['Generate Release Notes']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        _BRANCH_NAME="main-fija"
        
        echo "Subiendo Release Notes a gs://${_PROJECT_ID}-release-notes/${_BRANCH_NAME}/release_notes_latest.md"
        
        gsutil cp /workspace/release_notes.md gs://${_PROJECT_ID}-release-notes/${_BRANCH_NAME}/release_notes_latest.md \
          || echo "AVISO: La subida falló (esto es esperado si el bucket no existe o faltan credenciales de GCS). La URL simulada es: gs://${_PROJECT_ID}-release-notes/${_BRANCH_NAME}/release_notes_latest.md"

options:
  logging: CLOUD_LOGGING_ONLY