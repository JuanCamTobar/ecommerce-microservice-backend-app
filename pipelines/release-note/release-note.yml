substitutions:
  _CLUSTER_NAME: "mi-primer-cluster-taller"
  _CLUSTER_ZONE: "us-central1"
  _PROJECT_ID: "taller2-ingenieriasoftware"

steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build & Push Docker Image'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/${_PROJECT_ID}/${_REPO}:${SHORT_SHA}'
      - '-t'
      - 'gcr.io/${_PROJECT_ID}/${_REPO}:${_BRANCH_NAME}' 
      - '.'
  
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Docker Image'
    waitFor: ['Build & Push Docker Image']
    args:
      - 'push'
      - 'gcr.io/${_PROJECT_ID}/${_REPO}'
    
  - name: 'gcr.io/cloud-builders/git'
    id: 'Generate Release Notes'
    waitFor: ['Build & Push Docker Image']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Iniciando generación automática de Release Notes..."
        echo "==================================================="

        BRANCH_NAME_TO_USE=${_BRANCH_NAME}
        BUILD_DATE=$(date +"%Y-%m-%d %H:%M:%S")
        NEW_TAG="${SHORT_SHA}" # Usamos $SHORT_SHA para unicidad

        git fetch --unshallow || echo "Repositorio ya completo o no es shallow"
        git fetch --tags || echo "No se encontraron tags remotos"
        LASTTAG_GIT=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")

        echo "Último tag encontrado: $LASTTAG_GIT"
        echo "Rama actual: $BRANCH_NAME_TO_USE"
        echo "Commit actual: $SHORT_SHA"

        RELEASE_FILE="/workspace/release_notes_${NEW_TAG}.md"
        echo "Release Notes - ${NEW_TAG}" > $RELEASE_FILE
        echo "Fecha de despliegue: $BUILD_DATE" >> $RELEASE_FILE
        echo "Rama: $BRANCH_NAME_TO_USE" >> $RELEASE_FILE
        echo "Commit/Image Tag: $SHORT_SHA" >> $RELEASE_FILE
        echo "" >> $RELEASE_FILE

        echo "Cambios incluidos desde el último tag ($LASTTAG_GIT):" >> $RELEASE_FILE
        git log $LASTTAG_GIT..HEAD --pretty=format:"- %s (%an)" >> $RELEASE_FILE || echo "- Sin cambios detectados." >> $RELEASE_FILE

        cat $RELEASE_FILE
        cp $RELEASE_FILE /workspace/release_notes.md

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Upload Release Notes'
    waitFor: ['Generate Release Notes']
    args:
      - 'gsutil'
      - 'cp'
      - '/workspace/release_notes.md'
      - 'gs://${_PROJECT_ID}-release-notes/${_BRANCH_NAME}/release_notes_${SHORT_SHA}.md'


    
options:
  logging: CLOUD_LOGGING_ONLY
